<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập | VisionMate - IUH</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
    --blue:#0d4e96;
    --blue-light:#1a73e8;
    --orange:#ff6b35;
    --bg:#f4f7fb;
    --text:#1f2937;
    --muted:#6b7280;
    --border:#e5e7eb;
}

*{
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(135deg,#eaf0f8,#f7f9fc);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

/* CARD */
.container{
    width:100%;
    max-width:1100px;
    background:#fff;
    border-radius:26px;
    display:flex;
    overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.18);
}

/* LEFT */
.left-panel{
    flex:1.2;
    background:linear-gradient(145deg,var(--blue),var(--blue-light));
    color:#fff;
    padding:0;
    position:relative;
}

/* IUH HEADER */
.iuh-header{
    background:#fff;
    padding:18px 40px;
    display:flex;
    align-items:center;
    gap:10px;
}

.iuh-header img{
    height:100px;
}

.iuh-header span{
    color:#0d4e96;
    font-weight:700;
    font-size:30px;
}

/* BRAND */
.brand{
    padding:60px 50px;
    text-align:center;
}

.brand img{
    width:130px;
    height:130px;
    background:#fff;
    border-radius:50%;
    padding:18px;
    box-shadow:0 25px 60px rgba(0,0,0,.4);
    animation:float 6s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-16px)}
}

.brand h1{
    font-size:46px;
    font-weight:900;
    margin:26px 0 6px;
}

.brand h3{
    margin:0;
    color:var(--orange);
    letter-spacing:3px;
    font-weight:600;
}

.brand p{
    margin:18px auto 0;
    max-width:420px;
    opacity:.9;
    line-height:1.7;
}

/* RIGHT */
.right-panel{
    flex:1;
    background:var(--bg);
    padding:60px;
    display:flex;
    align-items:center;
}

.form-box{
    width:100%;
    max-width:420px;
    margin:auto;
}

.form-box h2{
    font-size:36px;
    font-weight:800;
    color:var(--blue);
    margin-bottom:6px;
}

.form-box p{
    color:var(--muted);
    margin-bottom:35px;
}

/* FORM */
.form-group{
    margin-bottom:22px;
}

label{
    font-weight:600;
    margin-bottom:8px;
    display:block;
}

.input{
    position:relative;
}

.input i{
    position:absolute;
    left:16px;
    top:50%;
    transform:translateY(-50%);
    color:#9ca3af;
}

input{
    width:100%;
    padding:16px 16px 16px 48px;
    border-radius:16px;
    border:2px solid var(--border);
    font-size:15px;
    transition:.3s;
}

input:focus{
    outline:none;
    border-color:var(--blue);
    box-shadow:0 0 0 4px rgba(13,78,150,.15);
}

/* REMEMBER */
.remember-forgot{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 30px;
    font-size:14px;
}

.remember{
    display:flex;
    gap:8px;
    align-items:center;
}

.remember input{
    width:18px;
    height:18px;
    accent-color:var(--blue);
}

.forgot-password{
    text-decoration:none;
    color:var(--blue);
    font-weight:600;
}

/* BUTTON */
.btn-signin{
    width:100%;
    border:none;
    padding:18px;
    border-radius:16px;
    font-size:17px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,var(--blue),var(--blue-light));
    box-shadow:0 18px 40px rgba(13,78,150,.4);
    transition:.35s;
}

.btn-signin:hover{
    transform:translateY(-3px);
    box-shadow:0 25px 55px rgba(13,78,150,.5);
}

.btn-signin:disabled{
    opacity:0.7;
    cursor:not-allowed;
    transform:none;
    box-shadow:0 18px 40px rgba(13,78,150,.4);
}

.signup-link{
    text-align:center;
    margin-top:28px;
    color:var(--muted);
}

.signup-link a{
    color:var(--blue);
    font-weight:700;
    text-decoration:none;
}

/* ERROR MESSAGE */
.error-message{
    background:#fee;
    color:#d32f2f;
    padding:12px 16px;
    border-radius:10px;
    border:1px solid #fcc;
    margin-bottom:20px;
    display:none;
    font-size:14px;
    font-weight:500;
}

.error-message.show{
    display:block;
}

.error-message i{
    margin-right:8px;
}

/* LOADING SPINNER */
.spinner{
    display:inline-block;
    width:18px;
    height:18px;
    border:2px solid rgba(255,255,255,0.3);
    border-radius:50%;
    border-top-color:#fff;
    animation:spin 0.8s linear infinite;
    margin-right:8px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* RESPONSIVE */
@media(max-width:900px){
    .container{flex-direction:column}
    .right-panel{padding:40px}
}
</style>
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-panel">

        <!-- IUH HEADER -->
        <div class="iuh-header">
            <img src="https://iuh.edu.vn/assets/images/iuh.png?v=51">
            <span>Industrial University of Ho Chi Minh City</span>
        </div>

        <!-- BRAND -->
        <div class="brand">
            <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
            <h1>VisionMate</h1>
            <h3>AI VISION ASSISTANT</h3>
        </div>

    </div>

    <!-- RIGHT -->
    <div class="right-panel">
        <div class="form-box">
            <h2>Đăng nhập</h2>
            <p>Nhập thông tin để tiếp tục</p>
            
            <!-- Error Message -->
            <div class="error-message" id="errorMessage">
                <i class="fa fa-exclamation-circle"></i>
                <span id="errorText">Sai email hoặc mật khẩu!</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <div class="input">
                        <i class="fa fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="example@visionmate.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Mật khẩu</label>
                    <div class="input">
                        <i class="fa fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="remember-forgot">
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <span>Ghi nhớ đăng nhập</span>
                    </div>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn-signin" id="submitBtn">
                    <span id="btnText">
                        <i class="fa fa-right-to-bracket"></i> Đăng nhập
                    </span>
                </button>
            </form>

            <div class="signup-link">
                Chưa có tài khoản? <a href="/signup">Đăng ký</a>
            </div>
        </div>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    
    // Kiểm tra xem có thông báo lỗi từ server không (Flash message)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === '1') {
        errorText.textContent = 'Đăng nhập thất bại. Vui lòng thử lại!';
        errorMessage.classList.add('show');
    }
    
    // Xử lý submit form
    loginForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Kiểm tra dữ liệu đầu vào
        const email = emailInput.value.trim();
        const password = passwordInput.value.trim();
        
        if (!email || !password) {
            errorText.textContent = 'Vui lòng nhập đầy đủ email và mật khẩu!';
            errorMessage.classList.add('show');
            return;
        }
        
        // Kiểm tra định dạng email
        if (!isValidEmail(email)) {
            errorText.textContent = 'Email không hợp lệ!';
            errorMessage.classList.add('show');
            return;
        }
        
        // Hiển thị loading
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Đang xử lý...';
        
        try {
            // Gửi request đến server
            const formData = new FormData(loginForm);
            
            const response = await fetch('/signin', {
                method: 'POST',
                body: new URLSearchParams({
                    email: email,
                    password: password
                }),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            });
            
            if (response.ok) {
                // Đăng nhập thành công, chuyển hướng đến dashboard
                window.location.href = '/dashboard';
            } else {
                // Đăng nhập thất bại
                const html = await response.text();
                let errorMsg = 'Sai email hoặc mật khẩu!';
                
                // Cố gắng trích xuất thông báo lỗi từ response
                if (html.includes('Sai email hoặc mật khẩu')) {
                    errorMsg = 'Sai email hoặc mật khẩu!';
                } else if (html.includes('Hệ thống đang bảo trì')) {
                    errorMsg = 'Hệ thống đang bảo trì. Vui lòng thử lại sau!';
                }
                
                errorText.textContent = errorMsg;
                errorMessage.classList.add('show');
                
                // Focus vào email input
                emailInput.focus();
                emailInput.select();
            }
            
        } catch (error) {
            // Lỗi mạng hoặc server
            errorText.textContent = 'Lỗi kết nối đến server. Vui lòng thử lại!';
            errorMessage.classList.add('show');
            console.error('Login error:', error);
        } finally {
            // Khôi phục trạng thái button
            submitBtn.disabled = false;
            btnText.innerHTML = '<i class="fa fa-right-to-bracket"></i> Đăng nhập';
        }
    });
    
    // Ẩn thông báo lỗi khi người dùng bắt đầu nhập
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);
    
    // Chức năng "Quên mật khẩu"
    document.querySelector('.forgot-password').addEventListener('click', function(e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (email && isValidEmail(email)) {
            alert(`Chức năng đặt lại mật khẩu đã được gửi đến ${email}`);
            // Có thể thêm API reset password ở đây
        } else {
            alert('Vui lòng nhập email hợp lệ để đặt lại mật khẩu');
            emailInput.focus();
        }
    });
    
    // Hàm kiểm tra email
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
    
    // Hàm ẩn thông báo lỗi
    function hideError() {
        errorMessage.classList.remove('show');
    }
    
    // Tự động focus vào email input khi trang load
    emailInput.focus();
});
</script>

</body>
</html>
