<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Đăng ký | VisionMate - IUH</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font & Icon -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --blue-iuh: #0d4e96;
            --blue-light: #1a73e8;
            --orange: #ff6b35;
            --bg: #f4f7fb;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eaf0f8, #f7f9fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 1100px;
            background: #fff;
            border-radius: 22px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .15);
        }

        /* LEFT */
        .left {
            flex: 1.2;
            background: linear-gradient(145deg, var(--blue-iuh), var(--blue-light));
            color: #fff;
            padding: 60px;
            position: relative;
        }

        .left::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, .08), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, .05), transparent 40%);
        }

        .iuh {
            width:500px;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            padding: 0;
            background: white;
            border: none;
            outline: none;
            display: block;
        }

        .iuh img {
            width: 500px;
            height: 150px;
            border-radius: 16px;
            object-fit: cover;
            padding: 0;
            color: transparent;
            background: none;

        }


        .iuh h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0;
        }

        .iuh p {
            margin: 6px 0 0;
            opacity: .9;
        }

        .brand {
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 1;
        }

        .brand img {
            width: 150px;
            height: 150px;
            background: #fff;
            border-radius: 50%;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .35);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-18px)
            }
        }

        .brand h2 {
            font-size: 48px;
            margin: 25px 0 5px;
            font-weight: 900;
        }

        .brand h3 {
            margin: 0;
            color: var(--orange);
            letter-spacing: 2px;
            font-weight: 600;
        }

        .brand p {
            max-width: 420px;
            margin: 15px auto 0;
            opacity: .9;
            line-height: 1.6;
        }

        /* RIGHT */
        .right {
            flex: 1;
            background: var(--bg);
            padding: 60px;
            display: flex;
            align-items: center;
        }

        .form-box {
            width: 100%;
            max-width: 420px;
            margin: auto;
        }

        .form-box h2 {
            font-size: 36px;
            margin: 0 0 10px;
            color: var(--blue-iuh);
        }

        .form-box p {
            color: var(--muted);
            margin-bottom: 35px;
        }

        .group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input {
            position: relative;
        }

        .input i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            border-radius: 14px;
            border: 2px solid var(--border);
            font-size: 15px;
            transition: .3s;
        }

        input:focus {
            outline: none;
            border-color: var(--blue-iuh);
            box-shadow: 0 0 0 4px rgba(13, 78, 150, .12);
        }

        .terms {
            display: flex;
            gap: 12px;
            background: #fff;
            padding: 18px;
            border-radius: 14px;
            border: 2px solid var(--border);
            margin: 30px 0;
            font-size: 14px;
        }

        .terms input {
            width: 18px;
            height: 18px;
            accent-color: var(--blue-iuh);
        }

        .btn {
            width: 100%;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--blue-iuh), var(--blue-light));
            box-shadow: 0 15px 35px rgba(13, 78, 150, .35);
            transition: .35s;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(13, 78, 150, .45);
        }
        
        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 15px 35px rgba(13, 78, 150, .35);
        }

        .login {
            text-align: center;
            margin-top: 25px;
            color: var(--muted);
        }

        .login a {
            color: var(--blue-iuh);
            font-weight: 700;
            text-decoration: none;
        }
        
        /* ERROR MESSAGE */
        .error-message {
            background: #fee;
            color: #d32f2f;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #fcc;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .error-message.show {
            display: block;
        }
        
        .error-message i {
            margin-right: 8px;
        }
        
        /* SUCCESS MESSAGE */
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid #c8e6c9;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        
        .success-message.show {
            display: block;
        }
        
        .success-message i {
            margin-right: 8px;
        }
        
        /* LOADING SPINNER */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* PASSWORD STRENGTH */
        .password-strength {
            margin-top: 8px;
            font-size: 13px;
            display: none;
        }
        
        .password-strength.show {
            display: block;
        }
        
        .strength-bar {
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
        }
        
        .strength-weak {
            background: #ef4444;
            width: 25%;
        }
        
        .strength-fair {
            background: #f59e0b;
            width: 50%;
        }
        
        .strength-good {
            background: #10b981;
            width: 75%;
        }
        
        .strength-strong {
            background: #0d4e96;
            width: 100%;
        }

        @media(max-width:900px) {
            .card {
                flex-direction: column
            }

            .left,
            .right {
                padding: 40px
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <!-- LEFT -->
        <div class="left">
            <div class="iuh">
                <img src="https://iuh.edu.vn/assets/images/icons/logo.svg?v=51">
            </div>

            <div class="brand">
                <img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">
                <h2>VisionMate</h2>
                <h3>AI Vision Assistant</h3>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="right">
            <div class="form-box">
                <h2>Tạo tài khoản</h2>
                <p>Điền thông tin bên dưới để đăng ký</p>
                
                <!-- Error Message -->
                <div class="error-message" id="errorMessage">
                    <i class="fa fa-exclamation-circle"></i>
                    <span id="errorText">Vui lòng kiểm tra thông tin!</span>
                </div>
                
                <!-- Success Message -->
                <div class="success-message" id="successMessage">
                    <i class="fa fa-check-circle"></i>
                    <span id="successText">Đăng ký thành công!</span>
                </div>

                <form id="signupForm">
                    <div class="group">
                        <label>Họ và tên <span style="color:#ef4444">*</span></label>
                        <div class="input">
                            <i class="fa fa-user"></i>
                            <input type="text" id="name" name="name" placeholder="Nguyễn Văn A" required>
                        </div>
                    </div>

                    <div class="group">
                        <label>Email <span style="color:#ef4444">*</span></label>
                        <div class="input">
                            <i class="fa fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="abc@iuh.edu.vn" required>
                        </div>
                    </div>

                    <div class="group">
                        <label>Mật khẩu <span style="color:#ef4444">*</span></label>
                        <div class="input">
                            <i class="fa fa-lock"></i>
                            <input type="password" id="password" name="password" placeholder="Ít nhất 8 ký tự" required>
                        </div>
                        <div class="password-strength" id="passwordStrength">
                            <div class="strength-text"></div>
                            <div class="strength-bar">
                                <div class="strength-fill"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="group">
                        <label>Xác nhận mật khẩu <span style="color:#ef4444">*</span></label>
                        <div class="input">
                            <i class="fa fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                        </div>
                        <div id="passwordMatch" style="font-size:13px; margin-top:8px; display:none;"></div>
                    </div>

                    <div class="terms">
                        <input type="checkbox" id="agreeTerms" required>
                        <span>Tôi đồng ý với <a href="#" style="color:var(--blue-iuh); text-decoration:underline;">điều khoản sử dụng</a>.</span>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        <span id="btnText">
                            <i class="fa fa-user-plus"></i> Đăng ký
                        </span>
                    </button>
                </form>

                <div class="login">
                    Đã có tài khoản? <a href="/signin">Đăng nhập</a>
                </div>
            </div>
        </div>

    </div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const signupForm = document.getElementById('signupForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const agreeTermsCheckbox = document.getElementById('agreeTerms');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const passwordStrength = document.getElementById('passwordStrength');
    const strengthFill = passwordStrength.querySelector('.strength-fill');
    const strengthText = passwordStrength.querySelector('.strength-text');
    const passwordMatch = document.getElementById('passwordMatch');
    
    // Xử lý kiểm tra độ mạnh mật khẩu
    passwordInput.addEventListener('input', function() {
        const password = passwordInput.value;
        let strength = 0;
        let text = '';
        let className = '';
        
        if (password.length > 0) {
            passwordStrength.classList.add('show');
            
            // Kiểm tra độ dài
            if (password.length >= 8) strength++;
            
            // Kiểm tra chữ thường
            if (/[a-z]/.test(password)) strength++;
            
            // Kiểm tra chữ hoa
            if (/[A-Z]/.test(password)) strength++;
            
            // Kiểm tra số
            if (/\d/.test(password)) strength++;
            
            // Kiểm tra ký tự đặc biệt
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            // Xác định độ mạnh
            switch(strength) {
                case 0:
                case 1:
                    text = 'Rất yếu';
                    className = 'strength-weak';
                    break;
                case 2:
                    text = 'Yếu';
                    className = 'strength-weak';
                    break;
                case 3:
                    text = 'Trung bình';
                    className = 'strength-fair';
                    break;
                case 4:
                    text = 'Mạnh';
                    className = 'strength-good';
                    break;
                case 5:
                    text = 'Rất mạnh';
                    className = 'strength-strong';
                    break;
            }
            
            strengthFill.className = 'strength-fill ' + className;
            strengthText.textContent = `Độ mạnh: ${text}`;
            
            // Kiểm tra mật khẩu trùng khớp
            checkPasswordMatch();
        } else {
            passwordStrength.classList.remove('show');
            passwordMatch.style.display = 'none';
        }
    });
    
    // Kiểm tra mật khẩu trùng khớp
    confirmPasswordInput.addEventListener('input', checkPasswordMatch);
    
    function checkPasswordMatch() {
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;
        
        if (confirmPassword.length === 0) {
            passwordMatch.style.display = 'none';
            return;
        }
        
        passwordMatch.style.display = 'block';
        
        if (password === confirmPassword) {
            passwordMatch.innerHTML = '<span style="color:#10b981;"><i class="fa fa-check"></i> Mật khẩu trùng khớp</span>';
            return true;
        } else {
            passwordMatch.innerHTML = '<span style="color:#ef4444;"><i class="fa fa-times"></i> Mật khẩu không khớp</span>';
            return false;
        }
    }
    
    // Xử lý submit form
    signupForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // Ẩn tất cả thông báo
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');
        
        // Lấy giá trị từ form
        const name = nameInput.value.trim();
        const email = emailInput.value.trim().toLowerCase();
        const password = passwordInput.value.trim();
        const confirmPassword = confirmPasswordInput.value.trim();
        
        // Kiểm tra dữ liệu đầu vào
        if (!name || !email || !password || !confirmPassword) {
            errorText.textContent = 'Vui lòng điền đầy đủ thông tin!';
            errorMessage.classList.add('show');
            return;
        }
        
        // Kiểm tra định dạng email
        if (!isValidEmail(email)) {
            errorText.textContent = 'Email không hợp lệ!';
            errorMessage.classList.add('show');
            emailInput.focus();
            return;
        }
        
        // Kiểm tra độ dài mật khẩu
        if (password.length < 8) {
            errorText.textContent = 'Mật khẩu phải có ít nhất 8 ký tự!';
            errorMessage.classList.add('show');
            passwordInput.focus();
            return;
        }
        
        // Kiểm tra mật khẩu trùng khớp
        if (!checkPasswordMatch()) {
            errorText.textContent = 'Mật khẩu xác nhận không khớp!';
            errorMessage.classList.add('show');
            confirmPasswordInput.focus();
            return;
        }
        
        // Kiểm tra điều khoản
        if (!agreeTermsCheckbox.checked) {
            errorText.textContent = 'Vui lòng đồng ý với điều khoản sử dụng!';
            errorMessage.classList.add('show');
            return;
        }
        
        // Hiển thị loading
        submitBtn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Đang xử lý...';
        
        try {
            // Gửi request đến server
            const response = await fetch('/signup', {
                method: 'POST',
                body: new URLSearchParams({
                    name: name,
                    email: email,
                    password: password
                }),
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            });
            
            if (response.ok) {
                // Đăng ký thành công
                successText.textContent = 'Đăng ký thành công! Chuyển hướng đến trang đăng nhập...';
                successMessage.classList.add('show');
                
                // Reset form
                signupForm.reset();
                passwordStrength.classList.remove('show');
                passwordMatch.style.display = 'none';
                
                // Chuyển hướng sau 2 giây
                setTimeout(() => {
                    window.location.href = '/signin?message=signup_success';
                }, 2000);
                
            } else {
                // Đăng ký thất bại
                const html = await response.text();
                let errorMsg = 'Đăng ký thất bại. Vui lòng thử lại!';
                
                // Cố gắng trích xuất thông báo lỗi từ response
                if (html.includes('Email này đã được đăng ký')) {
                    errorMsg = 'Email này đã được đăng ký!';
                } else if (html.includes('Email không hợp lệ')) {
                    errorMsg = 'Email không hợp lệ!';
                } else if (html.includes('Mật khẩu phải có ít nhất 6 ký tự')) {
                    errorMsg = 'Mật khẩu phải có ít nhất 6 ký tự!';
                } else if (html.includes('Hệ thống đang bảo trì')) {
                    errorMsg = 'Hệ thống đang bảo trì. Vui lòng thử lại sau!';
                }
                
                errorText.textContent = errorMsg;
                errorMessage.classList.add('show');
                
                // Focus vào email input nếu lỗi email
                if (errorMsg.includes('Email')) {
                    emailInput.focus();
                    emailInput.select();
                }
            }
            
        } catch (error) {
            // Lỗi mạng hoặc server
            errorText.textContent = 'Lỗi kết nối đến server. Vui lòng thử lại!';
            errorMessage.classList.add('show');
            console.error('Signup error:', error);
        } finally {
            // Khôi phục trạng thái button
            submitBtn.disabled = false;
            btnText.innerHTML = '<i class="fa fa-user-plus"></i> Đăng ký';
        }
    });
    
    // Ẩn thông báo lỗi khi người dùng bắt đầu nhập
    nameInput.addEventListener('input', hideError);
    emailInput.addEventListener('input', hideError);
    passwordInput.addEventListener('input', hideError);
    confirmPasswordInput.addEventListener('input', hideError);
    
    // Hàm kiểm tra email
    function isValidEmail(email) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(email);
    }
    
    // Hàm ẩn thông báo lỗi
    function hideError() {
        errorMessage.classList.remove('show');
    }
    
    // Tự động focus vào name input khi trang load
    nameInput.focus();
    
    // Kiểm tra nếu có message từ URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('message') === 'signup_success') {
        successText.textContent = 'Đăng ký thành công! Vui lòng đăng nhập.';
        successMessage.classList.add('show');
    }
});
</script>

</body>

</html>
